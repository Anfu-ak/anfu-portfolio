<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品展示 · Anfu's World</title>
  <meta name="description" content="尹浩怡（Anfu）的插画与短视频作品">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <!-- 手写风字体（已下载到本地，不依赖 Google 服务器，离线也能显示） -->
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css?v=12">
</head>
<body data-page="works">

  <div class="bg-decor" aria-hidden="true"></div>
  <div class="bg-grain" aria-hidden="true"></div>

  <!-- ========== 顶部固定导航栏 ========== -->
  <header class="site-header">
    <div class="nav-inner">
      <a class="logo" href="index.html">✿ Anfu<span class="logo-sub">'s world</span></a>
      <button class="nav-toggle" aria-label="打开菜单" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="siteNav">
        <a href="index.html" data-nav="home">首页</a>
        <a href="works.html" data-nav="works">作品展示</a>
        <a href="about.html" data-nav="about">关于我</a>
        <a href="contact.html" data-nav="contact">联系我</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- 页面标题 -->
    <div class="page-banner reveal">
      <span class="kicker">my gallery</span>
      <h1>我的作品</h1>
      <p>点击任意卡片，可以查看 PNG 原图 / 播放视频，左右箭头切换 ♡</p>
    </div>

    <!-- 跑马灯条幅：滚动的小标签，悬停会暂停 -->
    <div class="marquee" aria-hidden="true">
      <div class="marquee-track">
        <span class="mq-group"><b>插画作品</b> ✿ <span>短视频</span> ✦ <b>手账拼贴</b> ♡ <span>奇思妙想</span> ✧ <b>随手画</b> ✦ <span>小小世界</span> ♡ <b>插画作品</b> ✿ <span>短视频</span> ✦ <b>手账拼贴</b> ♡ <span>奇思妙想</span> ✧</span>
        <span class="mq-group"><b>插画作品</b> ✿ <span>短视频</span> ✦ <b>手账拼贴</b> ♡ <span>奇思妙想</span> ✧ <b>随手画</b> ✦ <span>小小世界</span> ♡ <b>插画作品</b> ✿ <span>短视频</span> ✦ <b>手账拼贴</b> ♡ <span>奇思妙想</span> ✧</span>
      </div>
    </div>

    <!-- 分类筛选按钮（data-cat 对应 works-data.js 里的 category） -->
    <div class="filters reveal" data-delay="80">
      <button class="filter-btn is-active" data-cat="all">全部</button>
      <button class="filter-btn" data-cat="illustration">插画作品</button>
      <button class="filter-btn" data-cat="video">短视频</button>
    </div>

    <!-- 作品画廊：作品像照片一样挂在绳子上，按住即可左右拖动浏览（卡片由 js 自动生成） -->
    <div class="gallery-wrap" id="galleryWrap">
      <div class="gallery-rope" aria-hidden="true"></div>
      <div class="gallery-track" id="galleryTrack"></div>
      <p class="gallery-hint" aria-hidden="true">✧ 按住作品，左右拖动看看 ✧</p>
      <div class="gallery-progress" aria-hidden="true"><i></i></div>
    </div>
  </main>

  <!-- ========== 大图弹窗（点击作品卡片后出现） ========== -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="作品大图预览">
    <div class="lightbox-mask"></div>
    <button class="lightbox-btn lightbox-close" aria-label="关闭大图">✕</button>
    <button class="lightbox-btn lightbox-prev" aria-label="上一张">←</button>
    <button class="lightbox-btn lightbox-next" aria-label="下一张">→</button>
    <div class="lightbox-inner">
      <div class="lightbox-media"></div>
      <div class="lightbox-caption">
        <div>
          <h3 class="lightbox-title"></h3>
          <p class="lightbox-desc"></p>
        </div>
        <span class="lightbox-count"></span>
      </div>
    </div>
  </div>

  <!-- ========== 页脚 ========== -->
  <footer class="site-footer">
    <div class="container">
      <nav class="foot-nav">
        <a href="index.html">首页</a>
        <a href="works.html">作品展示</a>
        <a href="about.html">关于我</a>
        <a href="contact.html">联系我</a>
      </nav>
      <p>© <span id="year">2026</span> Anfu（尹浩怡） · 用 <span style="color:#f0aeb8">♡</span> 画出来的小世界
        <a class="foot-edit" href="editor.html" title="仅自己使用：管理作品与文字">· ✎ 管理内容</a>
      </p>
    </div>
  </footer>

  <button class="back-fab" id="backBtn" aria-label="返回上一页">
    🔙<span class="back-tip">返回上一页</span>
  </button>

  <script src="js/content-store.js?v=12"></script>
  <script src="js/profile-data.js?v=12"></script>
  <script src="js/works-data.js?v=12"></script>
  <script src="js/main.js?v=12"></script>
</body>
</html>
